# Included in every location: an add_header in a location drops the ones inherited from the server block.

# The app never sends data anywhere: DICOM files are parsed in the browser.
# connect-src 'none' makes the browser enforce it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
